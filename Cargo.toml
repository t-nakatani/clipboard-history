[workspace]
members = [
    "crates/clipboard-core",
    "crates/clipboard-store",
    "crates/clipboard-ffi",
]
exclude = ["experiments/clipboard-history-poc"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
blake3 = "1.8.5"
rusqlite = { version = "=0.39.0", features = ["bundled"] }
uniffi = "0.32.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
