name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "リリースするタグ（例: v0.1.0-alpha.1）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  macos-release:
    name: Publish unsigned macOS app
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "::error::タグは v で始まる必要があります: $tag"; exit 1 ;;
          esac
          version="${tag#v}"
          # 0.1.0-alpha.1 のようなpre-release識別子を落としてversion coreを得る
          core="${version%%-*}"
          if [ "$version" = "$core" ]; then
            prerelease=false
          else
            prerelease=true
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "core=$core"
            echo "prerelease=$prerelease"
            echo "asset=ClipboardHistory-$tag-macos-arm64-unsigned.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve tag to a commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -eu
          # workflow_dispatchの入力は非修飾のままだとbranchやSHAとしても解決される。
          # tag namespaceだけを見て、buildより前に実体のcommitを確定させる。
          if ! gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::タグが存在しません: $TAG"
            exit 1
          fi
          sha=$(gh api "repos/$REPO/commits/tags/$TAG" --jq '.sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$TAG -> $sha"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Verify checkout matches the tag
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          EXPECTED_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -eu
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::checkoutしたcommit ($actual) がタグ $TAG のcommit ($EXPECTED_SHA) と一致しません"
            exit 1
          fi

      - name: Verify version metadata matches tag
        env:
          CORE: ${{ steps.meta.outputs.core }}
        run: |
          set -eu
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' app/macos/Info.plist)
          if [ "$plist_version" != "$CORE" ]; then
            echo "::error::Info.plistのCFBundleShortVersionString ($plist_version) がタグ ($CORE) と一致しません"
            exit 1
          fi
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$cargo_version" != "$CORE" ]; then
            echo "::error::Cargo.tomlのworkspace version ($cargo_version) がタグ ($CORE) と一致しません"
            exit 1
          fi

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-release-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-release-
            ${{ runner.os }}-${{ runner.arch }}-rust-macos-

      - name: Show build environment
        run: |
          rustc --version
          cargo --version
          swiftc --version
          xcodebuild -version

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Build app and run Swift/UniFFI self-test
        run: ./app/macos/build-macos-app.sh

      - name: Verify built bundle
        run: |
          set -eu
          app="app/macos/build/ClipboardHistory.app"
          executable="$app/Contents/MacOS/ClipboardHistory"
          dylib="$app/Contents/Frameworks/libclipboard_ffi.dylib"
          test -x "$executable"
          test -f "$dylib"
          # bundle内のdylibだけを参照し、build machine固有のパスを残さないこと
          if otool -L "$executable" | grep -q "$PWD/target"; then
            echo "::error::実行ファイルがbuild treeへの絶対パスを参照しています"
            otool -L "$executable"
            exit 1
          fi
          lipo -archs "$executable"
          # deployment targetの宣言(LSMinimumSystemVersion)と実体(LC_BUILD_VERSION)が
          # 食い違うと、宣言を信じた古いOSの利用者がdyldのエラーで起動できない。
          # 同梱dylibもdyldが読むので同じ強さで見る。
          normalize_version() {
            printf '%s' "$1" | awk -F. '{
              major = $1 + 0
              minor = ($2 == "" ? 0 : $2 + 0)
              patch = ($3 == "" ? 0 : $3 + 0)
              if (patch > 0) { printf "%d.%d.%d", major, minor, patch }
              else { printf "%d.%d", major, minor }
            }'
          }
          declared_raw=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")
          declared=$(normalize_version "$declared_raw")
          for binary in "$executable" "$dylib"; do
            actual_raw=$(vtool -show-build "$binary" | awk '$1 == "minos" { print $2; exit }')
            if [ -z "$actual_raw" ]; then
              echo "::error::$binary からLC_BUILD_VERSIONのminosを読めません"
              vtool -show-build "$binary"
              exit 1
            fi
            actual=$(normalize_version "$actual_raw")
            if [ "$actual" != "$declared" ]; then
              echo "::error::$binary のminos ($actual) がLSMinimumSystemVersion ($declared) と一致しません"
              vtool -show-build "$binary"
              exit 1
            fi
          done
          echo "minos $declared / LSMinimumSystemVersion $declared_raw"

      - name: Package unsigned app
        id: package
        env:
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          set -eu
          ditto -c -k --sequesterRsrc --keepParent \
            app/macos/build/ClipboardHistory.app \
            "app/macos/build/$ASSET"
          checksum=$(shasum -a 256 "app/macos/build/$ASSET" | awk '{print $1}')
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        env:
          ASSET: ${{ steps.meta.outputs.asset }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -eu
          # 式の結果をrun:へ直接展開せず、placeholderを後から埋める
          cat > release-notes.template.md <<'NOTES'
          > [!WARNING]
          > このビルドは**署名もnotarizationもされていません**。Apple Silicon (arm64) 専用です。
          > 内容を確認できない場合はインストールしないでください。

          ## インストール

          ```sh
          unzip @ASSET@
          xattr -dr com.apple.quarantine ClipboardHistory.app
          mv ClipboardHistory.app /Applications/
          open /Applications/ClipboardHistory.app
          ```

          menu barにアイコンが出ます。`LSUIElement`のためウィンドウは開きません。

          履歴は次へ平文で保存されます。

          ```text
          ~/Library/Application Support/ClipboardHistory/
          ```

          ## SHA-256

          ```text
          @CHECKSUM@  @ASSET@
          ```

          ## 変更点と既知の問題

          [CHANGELOG.md](https://github.com/@REPO@/blob/@TAG@/CHANGELOG.md)を参照してください。
          NOTES
          sed -e "s|@ASSET@|$ASSET|g" \
              -e "s|@CHECKSUM@|$CHECKSUM|g" \
              -e "s|@REPO@|$REPO|g" \
              -e "s|@TAG@|$TAG|g" \
              release-notes.template.md > release-notes.md
          rm release-notes.template.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          set -eu
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag=--prerelease
          else
            prerelease_flag=
          fi
          # --verify-tag: タグが無いときにdefault branchから作らせない
          gh release create "$TAG" \
            "app/macos/build/$ASSET" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            --verify-tag \
            ${prerelease_flag:+"$prerelease_flag"}
