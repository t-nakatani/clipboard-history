name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-

      - name: Show toolchain
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-targets

      - name: Build release workspace
        run: cargo build --workspace --release

  storage-poc:
    name: Independent storage PoC
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            experiments/clipboard-history-poc/target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-storage-poc-${{ hashFiles('rust-toolchain.toml', 'experiments/clipboard-history-poc/Cargo.lock', 'experiments/clipboard-history-poc/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-storage-poc-

      - name: Lint PoC
        run: cargo clippy --manifest-path experiments/clipboard-history-poc/Cargo.toml --all-targets -- -D warnings

      - name: Test PoC
        run: cargo test --manifest-path experiments/clipboard-history-poc/Cargo.toml --all-targets

      - name: Build release PoC
        run: cargo build --manifest-path experiments/clipboard-history-poc/Cargo.toml --release

  macos-app:
    name: macOS app and UniFFI
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache Cargo dependencies and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-macos-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-macos-

      - name: Show build environment
        run: |
          rustc --version
          cargo --version
          swiftc --version
          xcodebuild -version

      - name: Build app and run Swift/UniFFI self-test
        run: ./app/macos/build-macos-app.sh

      - name: Smoke-test image preview PoC
        env:
          IMAGE_PREVIEW_ITERATIONS: 5
          IMAGE_PREVIEW_STORAGE_ROWS: 1000
        run: ./experiments/run-image-preview-poc.sh

      - name: Package unsigned app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            app/macos/build/ClipboardHistory.app \
            app/macos/build/ClipboardHistory-unsigned.zip

      - name: Upload unsigned app
        uses: actions/upload-artifact@v7
        with:
          name: ClipboardHistory-unsigned-${{ github.sha }}
          path: app/macos/build/ClipboardHistory-unsigned.zip
          if-no-files-found: error
          retention-days: 7
